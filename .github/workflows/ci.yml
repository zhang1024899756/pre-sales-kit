name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.12"
          - os: windows-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 静态检查
        shell: bash
        run: |
          set +e
          ruff check src tests > ruff.log 2>&1; r=$?
          mypy src > mypy.log 2>&1; m=$?
          cat ruff.log; cat mypy.log
          if [ "$r" -ne 0 ]; then grep -E "^[^ ]+\.py:" ruff.log | head -15 | while IFS= read -r l; do echo "::error title=ruff::$l"; done; fi
          if [ "$m" -ne 0 ]; then grep -E "error:" mypy.log | head -15 | while IFS= read -r l; do echo "::error title=mypy::$l"; done; fi
          [ "$r" -eq 0 ] && [ "$m" -eq 0 ]
      - name: 测试
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short 2>&1 | tee pytest.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -E "^(FAILED|ERROR)" pytest.log | head -20 | while IFS= read -r l; do echo "::error title=pytest::$l"; done
          fi
          exit "$code"
      - name: CLI 冒烟
        run: |
          kit --version
          kit selfcheck
          kit doctor --list-types
          kit seed --list-models
          kit init smoke-examples
          kit compat matrix -m smoke-examples/matrix.yaml --md out/matrix.md
          kit demo status --dir smoke-examples
