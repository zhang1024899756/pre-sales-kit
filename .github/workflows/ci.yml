name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os ${{ · Python ${{ matrix.python ${{
    runs-on: ${{ matrix.os ${{
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python ${{
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 静态检查
        run: |
          ruff check src tests
          mypy src
      - name: 测试
        run: pytest -q
      - name: CLI 冒烟
        run: |
          kit --version
          kit doctor --list-types
          kit seed --list-models
